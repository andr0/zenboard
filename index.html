<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Открытие приложения...</title>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const deepLink = id ? `zenboard://${id}` : 'zenboard://';
    window.location.href = deepLink;
  </script>
</head>
<body>
  <p>Открываем приложение... Если ничего не произошло, <a id="manual-link" href="zenboard://">нажмите сюда</a>.</p>
  <script>
    document.getElementById('manual-link').href = deepLink;
  </script>
</body>
</html>
